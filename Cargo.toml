[package]
name = "xmip-core-audit-windows-event-log"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-audit-windows-event-log"
description = "The Windows Event Log, Application, source Xmip: ADR-0062's operating system's log on Windows, which the program that runs hands its audit when audit cannot persist. A xmip-core-audit technology."
publish = false

[lib]
path = "src/lib.rs"

# Every dependency is Windows's alone: on any other platform the crate is
# empty, and cargo refuses a dependency a build does not use
# (unused_dependencies, Cargo 1.100).
[target.'cfg(windows)'.dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the operating system's log is audit's seam, and
# the entry's text audit's.
audit = { package = "xmip-core-audit", git = "https://github.com/IlleNilsson/xmip-core-audit", branch = "main" }
# The event source's name, XMIP_EVENT_SOURCE, from the header that declares it.
abi = { package = "xmip-core-abi", git = "https://github.com/IlleNilsson/xmip-core-abi", branch = "main" }
# An entry's text crosses to Windows as codec's wide string.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The severity an entry is written at.
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
# The Event Log and the registry are C interfaces, reached from one file,
# src/system.rs (ADR-0050, amendment 2026-09-25).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Registry",
] }

[lints.rust]
# deny, not forbid, because forbid cannot be lowered anywhere: the one file
# that calls the Windows Event Log, src/system.rs, allows it with its reason
# at the top (ADR-0050, amendment 2026-09-25), and nothing else may.
# test/Unsafe.Test.ps1 holds the list.
unsafe_code = "deny"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
